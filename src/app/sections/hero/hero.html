<section id="top" aria-labelledby="hero-name" class="mx-auto grid max-w-6xl items-center gap-12 px-5 pb-20 pt-14 sm:px-8 md:grid-cols-[1fr_auto] md:gap-16 md:pb-28 md:pt-24">
  <div>
    <p class="inline-flex items-center gap-2.5 rounded-full bg-accent-soft px-3.5 py-1.5 font-mono text-xs font-medium text-accent">
      <span class="size-1.5 rounded-full bg-accent"></span>
      {{ profile.title }}
    </p>
    <h1 id="hero-name" class="mt-6 text-5xl font-semibold leading-[1.02] tracking-tight sm:text-7xl">{{ profile.name }}</h1>
    <p class="mt-6 max-w-xl text-xl leading-relaxed text-muted sm:text-2xl sm:leading-relaxed">{{ profile.headline }}</p>

    <ul class="mt-6 flex flex-wrap gap-x-6 gap-y-2 text-sm text-muted">
      <li class="flex items-center gap-1.5"><app-icon name="pin" [size]="16" />{{ profile.location }}</li>
      <li><span class="font-semibold text-ink">{{ years }}+ years</span> in software</li>
    </ul>

    <div class="mt-9 flex flex-wrap items-center gap-3">
      <a href="#projects" [class]="button.primary">
        View projects
        <app-icon name="arrow-right" [size]="16" />
      </a>
      <a [href]="profile.cvUrl" download appTrackCv="hero" [class]="button.secondary">
        <app-icon name="download" [size]="16" />
        Download CV
      </a>
      <span class="mx-1 hidden h-6 w-px bg-line sm:block"></span>
      <a [href]="profile.github" target="_blank" rel="noopener" aria-label="GitHub" class="flex size-10 items-center justify-center rounded-full text-muted ring-1 ring-line hover:text-ink hover:ring-ink">
        <app-icon name="github" [size]="18" />
      </a>
      <a [href]="profile.linkedin" target="_blank" rel="noopener" aria-label="LinkedIn" class="flex size-10 items-center justify-center rounded-full text-muted ring-1 ring-line hover:text-ink hover:ring-ink">
        <app-icon name="linkedin" [size]="17" />
      </a>
      <a [href]="'mailto:' + profile.email" aria-label="Email" class="flex size-10 items-center justify-center rounded-full text-muted ring-1 ring-line hover:text-ink hover:ring-ink">
        <app-icon name="mail" [size]="18" />
      </a>
    </div>
  </div>

  <div class="relative mx-auto w-64 sm:w-72 md:w-80">
    <div class="absolute -bottom-4 -right-4 h-full w-full rounded-3xl bg-accent"></div>
    <img
      [src]="profile.photoUrl"
      [alt]="'Portrait of ' + profile.name"
      width="640"
      height="800"
      fetchpriority="high"
      class="relative aspect-[4/5] w-full rounded-3xl object-cover ring-1 ring-ink/10"
    />
  </div>
</section>
