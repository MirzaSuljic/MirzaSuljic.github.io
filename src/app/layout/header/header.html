<header class="sticky top-0 z-40 border-b border-line/70 bg-paper/85 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-6 px-5 sm:px-8">
    <a href="#top" class="flex items-center gap-3 rounded font-semibold tracking-tight" (click)="open.set(false)">
      <span class="flex size-8 items-center justify-center rounded-lg bg-accent font-mono text-xs font-medium text-paper">MS</span>
      <span>{{ profile.name }}</span>
    </a>

    <nav aria-label="Main" class="hidden items-center gap-1 md:flex">
      @for (link of links; track link.href) {
        <a [href]="link.href" class="rounded-full px-3 py-2 text-sm text-muted transition-colors hover:text-ink">{{ link.label }}</a>
      }
      <a [href]="profile.cvUrl" download appTrackCv="header" [class]="button.primary + ' ml-3'">
        <app-icon name="download" [size]="16" />
        CV
      </a>
    </nav>

    <button
      type="button"
      class="flex size-10 items-center justify-center rounded-full ring-1 ring-line md:hidden"
      [attr.aria-expanded]="open()"
      aria-controls="mobile-menu"
      [attr.aria-label]="open() ? 'Close menu' : 'Open menu'"
      (click)="open.set(!open())"
    >
      <app-icon [name]="open() ? 'close' : 'menu'" />
    </button>
  </div>

  @if (open()) {
    <nav id="mobile-menu" aria-label="Main" class="border-t border-line px-5 pb-6 pt-2 md:hidden">
      <ul>
        @for (link of links; track link.href) {
          <li>
            <a [href]="link.href" class="block border-b border-line/70 py-3.5 text-lg" (click)="open.set(false)">{{ link.label }}</a>
          </li>
        }
      </ul>
      <a [href]="profile.cvUrl" download appTrackCv="mobile-menu" [class]="button.primary + ' mt-5 w-full'">
        <app-icon name="download" [size]="16" />
        Download CV
      </a>
    </nav>
  }
</header>
